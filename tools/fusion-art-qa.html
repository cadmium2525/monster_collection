<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>特殊合体アート36体 QA</title>
    <link rel="stylesheet" href="../styles.css?v=1.9.1">
    <style>
      body { overflow: auto; padding: 24px; background: #070d16; color: #f5e8c4; }
      main { width: min(1400px,100%); margin: auto; }
      h1 { margin: 0 0 8px; }
      p { color: #aeb9c7; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(130px,1fr)); gap: 18px; padding: 8px; }
      figure { display: grid; place-items: center; gap: 7px; margin: 0; padding: 12px; border: 1px solid #765b2e; border-radius: 10px; background: #111a27; }
      figure .game-card { width: min(100%,126px); }
      figcaption { padding-top: 7px; font-size: 12px; text-align: center; }
      figure[data-fusion-id="fusion-014"] { outline: 2px solid #68ddff; }
    </style>
  </head>
  <body>
    <main>
      <h1>特殊合体アート36体・実カード比率確認</h1>
      <p>各枠はバトル画面と同じ全面イラストカードです。中央の正方形部分で1体分を比率維持し、上下は同じ画像で自然に補完します。水色枠がブルードリルです。</p>
      <section id="grid" aria-label="特殊合体36体"></section>
    </main>
    <script type="module">
      import { loadMasterData, createMasterIndex } from '../src/data/master-loader.js';
      import { renderCard } from '../src/ui/card-renderer.js';

      const data = await loadMasterData();
      const index = createMasterIndex(data);
      const grid = document.querySelector('#grid');
      data.fusions.forEach((fusion, fusionIndex) => {
        const definition = index.monstersByName.get(fusion.main);
        const figure = document.createElement('figure');
        figure.dataset.fusionId = fusion.id;
        const unit = {
          specialFusionId: fusion.id,
          specialForm: fusion.name,
          specialTrait: fusion.trait,
          baseMonsterName: definition.name,
          faction: definition.faction,
          maxLife: definition.base.life,
          life: definition.base.life,
          atkBase: definition.base.atk,
          defBase: definition.base.def,
          atkMod: 0,
          defMod: 0,
          temporaryAtk: 0,
          temporaryDef: 0,
          timedDefBuffs: [],
          actionPoints: 1,
          summonedThisTurn: false,
          stunnedThisTurn: false,
          statuses: {},
        };
        const card = renderCard({ definition, unit, interactive: false, label: `${fusion.name}の実カード表示` });
        const caption = document.createElement('figcaption');
        caption.textContent = `${String(fusionIndex + 1).padStart(2, '0')} ${fusion.name}`;
        figure.append(card, caption);
        grid.append(figure);
      });
    </script>
  </body>
</html>
