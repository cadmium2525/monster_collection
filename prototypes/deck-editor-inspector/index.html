<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06111c">
  <title>効果を見ながら組むデッキ編集案 | Monster Construction</title>
  <link rel="stylesheet" href="../../styles.css?v=deck-editor-inspector-8">
  <link rel="stylesheet" href="./styles.css?v=deck-editor-inspector-8">
</head>
<body>
  <div id="prototype-root">
    <div class="prototype-backdrop" aria-hidden="true"></div>
    <main class="prototype-shell" aria-label="デッキ編集UI試作">
      <header class="prototype-header">
        <div class="title-block">
          <p>DECK WORKSHOP · UI PROTOTYPE</p>
          <div>
            <h1>ちゃんぴょんデッキを編集</h1>
            <span class="deck-count" id="deck-count">40 / 40</span>
            <span class="deck-cost">デッキ総TP <b>126</b></span>
          </div>
        </div>
        <ol class="edit-guide" aria-label="カード交換の手順">
          <li class="is-current"><b>1</b><span>外すカード</span></li>
          <li><b>2</b><span>候補を確認</span></li>
          <li><b>3</b><span>入替確定</span></li>
        </ol>
        <div class="header-actions">
          <button class="ghost-action" type="button" data-action="discard">変更を破棄</button>
          <button class="save-action" type="button" data-action="save">40枚を保存</button>
        </div>
      </header>

      <section class="prototype-workspace">
        <section class="deck-pane panel-frame" aria-labelledby="deck-heading">
          <div class="pane-heading">
            <div>
              <p>ACTIVE DECK</p>
              <h2 id="deck-heading">使用中の40枚</h2>
            </div>
            <div class="pane-tools">
              <div class="filter-group" role="group" aria-label="使用中カードの絞り込み">
                <button class="is-active" type="button" data-filter="all">すべて</button>
                <button type="button" data-filter="monster">モンスター</button>
                <button type="button" data-filter="support">サポート</button>
              </div>
              <label class="sort-control">
                <span>並び順</span>
                <select id="deck-sort" aria-label="使用中カードの並び順"></select>
              </label>
            </div>
          </div>
          <div class="deck-summary" id="deck-summary"></div>
          <div class="deck-grid" id="deck-grid" aria-label="使用中カード一覧"></div>
        </section>

        <aside class="inspector-pane panel-frame" aria-labelledby="inspector-heading">
          <div class="pane-heading inspector-heading-row">
            <div>
              <p>LIVE CARD INSPECTOR</p>
              <h2 id="inspector-heading">カード効果</h2>
            </div>
            <span class="always-visible-badge">常時表示</span>
          </div>
          <div id="card-inspector" class="card-inspector" aria-live="polite"></div>
        </aside>

        <section class="candidate-pane panel-frame" aria-labelledby="candidate-heading">
          <div class="pane-heading candidate-heading-row">
            <div class="candidate-heading-title">
              <p>REPLACEMENT POOL</p>
              <div><h2 id="candidate-heading">入替候補</h2><span id="candidate-count">36枚</span></div>
            </div>
            <div class="candidate-heading-tools">
              <div class="candidate-tabs" role="tablist" aria-label="候補の種類">
                <button class="is-active" type="button" role="tab">デッキ予備</button>
                <button type="button" role="tab">未所属</button>
              </div>
              <label class="sort-control">
                <span>並び順</span>
                <select id="candidate-sort" aria-label="入替候補の並び順"></select>
              </label>
            </div>
          </div>
          <div class="candidate-grid" id="candidate-grid" aria-label="入替候補カード一覧"></div>
        </section>
      </section>
    </main>
    <div class="prototype-toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="./preview.js?v=deck-editor-inspector-8"></script>
</body>
</html>
