<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <meta name="theme-color" content="#07111f">
    <meta name="description" content="モンスターコンストラクション - 40枚を育てて王座を目指すカードバトル">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="モンコン">
    <title>モンスターコンストラクション</title>
    <link rel="manifest" href="./manifest.webmanifest?v=1.35.7">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png?v=1.35.7">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png?v=1.35.7">
    <link rel="preload" as="image" type="image/webp" href="./assets/images/title/title-screen.webp?v=1.35.7">
    <link rel="stylesheet" href="./styles.css?v=1.35.7">
  </head>
  <body>
    <div id="app" class="app-shell" aria-live="polite">
      <div class="boot-screen">
        <div class="brand-mark" aria-hidden="true">MC</div>
        <p class="boot-message">ゲームを起動しています…</p>
        <div class="boot-progress" role="progressbar" aria-label="起動進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4">
          <i style="width:4%"></i>
        </div>
        <div class="boot-progress-copy"><span>INITIALIZING</span><strong>4%</strong></div>
      </div>
    </div>
    <div id="modal-root"></div>
    <div class="portrait-warning" role="status">
      <strong>端末を横向きにしてください</strong>
      <span>モンスターコンストラクションは横画面用に設計されています。</span>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        const updateKey = 'mc-sw-reload-1.35.7';
        const hadController = Boolean(navigator.serviceWorker.controller);
        let reloadingForUpdate = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController || reloadingForUpdate || sessionStorage.getItem(updateKey)) return;
          reloadingForUpdate = true;
          sessionStorage.setItem(updateKey, '1');
          location.reload();
        });
        navigator.serviceWorker.register('./sw.js?v=1.35.7', { scope: './', updateViaCache: 'none' }).catch(() => {});
      }
    </script>
    <script type="module" src="./src/app.js?v=1.35.7"></script>
  </body>
</html>
